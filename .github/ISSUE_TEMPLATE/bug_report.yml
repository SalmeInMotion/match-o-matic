name: Bug report
description: Report a reproducible Match-o-matic problem
title: "[Bug] "
labels:
  - bug
  - beta
body:
  - type: markdown
    attributes:
      value: |
        Thank you for testing Match-o-matic. Do not upload client footage,
        confidential project names, licence tokens or private file paths.

  - type: textarea
    id: happened
    attributes:
      label: What happened?
      description: Describe the visible result or error message.
      placeholder: The Solve node stopped after matching and showed...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a minimal or non-confidential example whenever possible.
      placeholder: |
        1. Create Match-o-matic Camera Only
        2. Set the plate sequence
        3. Press Execute
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
      placeholder: The shot should solve and build an OBJ camera.
    validations:
      required: true

  - type: dropdown
    id: stage
    attributes:
      label: Match-o-matic stage
      options:
        - Installation or activation
        - Plate
        - Lens
        - Enhance
        - Mask
        - fSpy
        - Track
        - Solve - Lukas
        - Solve - Spirula
        - Solve - Nodal
        - Orient
        - Dataset
        - Dense
        - Splats
        - Export
        - Update checker
        - Other
    validations:
      required: true

  - type: input
    id: matchomatic_version
    attributes:
      label: Match-o-matic version
      placeholder: 1.9.0
    validations:
      required: true

  - type: input
    id: houdini_version
    attributes:
      label: Houdini version and build
      placeholder: 22.0.429
    validations:
      required: true

  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste SalmeInMotion > Cam / Track > Match-o-matic Support > Copy Diagnostics.
      render: text

  - type: textarea
    id: evidence
    attributes:
      label: Screenshots or safe logs
      description: Attach only material you are allowed to share publicly.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed confidential footage, client names, private paths and licence data.
          required: true
